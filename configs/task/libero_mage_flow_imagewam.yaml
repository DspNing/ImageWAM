# @package _global_

defaults:
  - override /data: libero_omnigen2_pair
  - override /model: imagewam_mage_flow
  - _self_

data:
  train:
    mage_text_cache_dir: ${oc.env:MAGE_TEXT_CACHE_DIR,./data/mage_text_cache/libero/}
    mage_context_len: 120
    require_text_cache: false
    qwen_text_cache_dir: null
    qwen_text_cache_format: qwen3_flux2
  
  eval:
    mage_text_cache_dir: ${oc.env:MAGE_TEXT_CACHE_DIR,./data/mage_text_cache/libero/}
    mage_context_len: 120
    require_text_cache: false
    qwen_text_cache_dir: null
    qwen_text_cache_format: qwen3_flux2

batch_size: 32
num_workers: 4
prefetch_factor: 4
persistent_workers: true

learning_rate: 1e-4
num_epochs: 10
max_steps: null
log_every: 10
save_every: 2000
eval_every: 500
eval_num_samples: 2
keep_latest_state_only: true

gradient_accumulation_steps: 1
weight_decay: 1.0e-2
mixed_precision: "bf16"
resume: null

model:
  proprio_dim: ${data.train.processor.proprio_output_dim}

wandb:
  enabled: true
  project: imagewam
  name: libero_mage_flow_imagewam
